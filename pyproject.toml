[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinal-behavior-sdk"
dynamic = ["version"]
description = "Canonical Python authoring ABI for Cardinal Behavioral Programs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CardinalHQ"}]
dependencies = []

[project.urls]
Repository = "https://github.com/cardinalhq/behavior-sdk"

[tool.setuptools]
packages = ["behavior_sdk"]

[tool.setuptools.package-data]
behavior_sdk = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "behavior_sdk.__version__"}
